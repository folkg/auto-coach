name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: CI / Lint, Type Check, Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright
        run: bunx playwright install --with-deps chromium-headless-shell

      - name: Run checks
        run: bun run checks:ci

      - name: Build common and core
        run: bun run build

      - name: Build API
        run: bun run build:api

      - name: Build Functions
        run: bun run --cwd server/functions build

      - name: Build Client
        run: bun run build:client

      - name: Upload client build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-build-${{ github.sha }}
          path: client/dist/auto-gm
          if-no-files-found: error
          retention-days: 7

      - name: Build API container
        run: bun run container:build:cloud

      - name: Build Mutation API container
        run: bun run container:build:mutation-api:cloud
