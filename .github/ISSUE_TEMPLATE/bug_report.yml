name: Bug report
description: Report a reproducible problem without including sensitive data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, tokens, personal data, production identifiers, or live Yahoo data. See SECURITY.md for vulnerability reports.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include the smallest reproducible example using synthetic data or emulators.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: main or a commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the operating system, Bun version, and relevant emulator or browser details.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials, tokens, personal data, and production identifiers before posting.
      render: text
    validations:
      required: false
